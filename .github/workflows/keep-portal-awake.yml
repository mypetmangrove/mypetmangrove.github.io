# Free Supabase projects pause after 7 days without activity (for example over summer).
# This asks the database for the homepage totals every 3 days so it stays awake.
name: Keep teacher portal awake

on:
  schedule:
    - cron: "0 13 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ping Supabase
        run: |
          URL=$(node -p "require('./src/_data/site.json').portal.supabase_url")
          KEY=$(node -p "require('./src/_data/site.json').portal.supabase_key")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Portal not connected yet, skipping."; exit 0; fi
          curl -sf -X POST "${URL%/}/rest/v1/rpc/impact_totals" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
